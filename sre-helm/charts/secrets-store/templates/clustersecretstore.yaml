# ESO calls this provider "vault" generically — OpenBao is API-compatible,
# no separate provider type exists or is needed. auth.kubernetes with no
# secretRef/serviceAccountRef defaults to ESO's own controller identity
# (system:serviceaccount:external-secrets:external-secrets), which is
# exactly the identity the "eso-alertmanager-slack" OpenBao role
# (bound_service_account_names/namespaces) was configured to trust.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-alertmanager-slack
