apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kiali
  namespace: istio-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: kiali
  endpoints:
    - port: http-metrics   # Service port 9090, Kiali's own /metrics
      interval: 30s
