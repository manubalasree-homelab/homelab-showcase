# ContainerResource, not the plain Resource metric type — scopes the CPU
# check to just the productpage container specifically. Every workload here
# carries an Envoy sidecar (ADR-0012/0013); the plain Resource type measures
# the whole pod, so the sidecar's own CPU draw under proxied load would
# dilute the exact signal this demo is built to show cleanly. Full
# reasoning: docs/incidents.md #21.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: productpage
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: productpage-v1
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: productpage
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
