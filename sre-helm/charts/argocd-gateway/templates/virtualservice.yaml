apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: istio-system
spec:
  hosts:
    - {{ .Values.host }}
  gateways:
    - argocd-gateway
  http:
    - route:
        - destination:
            host: {{ .Values.backendService }}
            port:
              number: {{ .Values.backendPort }}
