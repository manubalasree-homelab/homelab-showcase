# Singleton by design — Thanos requires exactly one compactor running
# against a given bucket at a time (concurrent compaction corrupts blocks).
# replicas: 1 here, never templated/parameterized.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
  labels:
    app.kubernetes.io/name: thanos-compactor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
    spec:
      containers:
        - name: thanos-compactor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - compact
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --wait
            - --wait-interval=5m
            {{- if .Values.compactor.retention.raw }}
            - --retention.resolution-raw={{ .Values.compactor.retention.raw }}
            {{- end }}
            {{- if .Values.compactor.retention.fiveMinutes }}
            - --retention.resolution-5m={{ .Values.compactor.retention.fiveMinutes }}
            {{- end }}
            {{- if .Values.compactor.retention.oneHour }}
            - --retention.resolution-1h={{ .Values.compactor.retention.oneHour }}
            {{- end }}
          ports:
            - name: http
              containerPort: 10902
          volumeMounts:
            - name: objstore-config
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/compact
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
      volumes:
        - name: objstore-config
          secret:
            secretName: {{ .Values.objstoreSecretName }}
        - name: data
          emptyDir: {}
