apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-storegateway
  labels:
    app.kubernetes.io/name: thanos-storegateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-storegateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-storegateway
    spec:
      containers:
        - name: thanos-storegateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - store
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
          ports:
            - name: http
              containerPort: 10902
            - name: grpc
              containerPort: 10901
          volumeMounts:
            - name: objstore-config
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/store
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
      volumes:
        - name: objstore-config
          secret:
            secretName: {{ .Values.objstoreSecretName }}
        # Local index-header cache only, rebuildable from the bucket on
        # restart — no PVC needed at this homelab's data volume.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-storegateway
  labels:
    app.kubernetes.io/name: thanos-storegateway
spec:
  selector:
    app.kubernetes.io/name: thanos-storegateway
  ports:
    - name: http
      port: 10902
      targetPort: http
    - name: grpc
      port: 10901
      targetPort: grpc
