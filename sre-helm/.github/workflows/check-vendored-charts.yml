name: Check vendored charts

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check vendored charts
        id: check
        run: |
          chmod +x scripts/check-vendored-charts.sh
          ./scripts/check-vendored-charts.sh | tee /tmp/check-output.txt

      - name: Open PR if anything updated
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update vendored charts"
          title: "chore: update vendored charts"
          body-path: /tmp/check-output.txt
          branch: chore/update-vendored-charts
          delete-branch: true
