name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install PyYAML
        run: pip install pyyaml

      # Lints + template-renders charts/app-of-apps once per Cluster declared
      # in each envs/*/values.yaml — mirrors exactly how each Root actually
      # invokes it (helm.valueFiles + the thisCluster parameter), so this
      # scales on its own as more envs/clusters are added, no workflow edits.
      - name: helm lint + template
        run: |
          python3 - <<'PY'
          import glob
          import subprocess
          import sys

          import yaml

          failed = False
          for envfile in sorted(glob.glob("envs/*/values.yaml")):
              with open(envfile) as f:
                  data = yaml.safe_load(f)
              for cluster in data.get("clusters", []):
                  name = cluster["name"]
                  print(f"::group::{envfile} / cluster={name}")
                  for cmd in (
                      ["helm", "lint", "charts/app-of-apps", "-f", envfile, "--set", f"thisCluster={name}"],
                      ["helm", "template", "charts/app-of-apps", "-f", envfile, "--set", f"thisCluster={name}"],
                  ):
                      result = subprocess.run(cmd, capture_output=True, text=True)
                      print(" ".join(cmd))
                      print(result.stdout)
                      if result.returncode != 0:
                          print(result.stderr, file=sys.stderr)
                          failed = True
                  print("::endgroup::")

          sys.exit(1 if failed else 0)
          PY
