apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.env }}
  namespace: argocd
spec:
  description: "{{ .Values.env }} environment, cluster {{ .Values.thisCluster }}"
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
